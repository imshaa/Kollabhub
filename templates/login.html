{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — KollabHub</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <!-- <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" /> -->
  <link rel="stylesheet" href="{% static 'css/auth.css' %}" />
</head>

<body class="auth-page">

  <div class="kh-bg">
    <div class="kh-grid"></div>
    <div class="kh-orb kh-orb-1"></div>
    <div class="kh-orb kh-orb-2"></div>
  </div>

  <!-- ════════════════════════════════════════
       SCREEN: LOGIN
  ════════════════════════════════════════ -->
  <div class="kh-wrap animate-in" id="screenLogin">

    <a href="{% url 'home' %}" class="kh-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 5-7 7 7 7"/></svg>
      Back
    </a>

    <div class="kh-header">
      <div class="kh-logo">K</div>
      <h1 class="kh-title">Welcome back</h1>
      <p class="kh-sub">Sign in to your workspace</p>
    </div>

    <div class="kh-card">
      {% if error %}
      <div class="kh-alert kh-alert-error" id="loginError">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" id="loginForm" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="kh-field">
          <label class="kh-label">Email or username</label>
          <div class="kh-input-wrap">
            <svg class="kh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-8 16-8 16 0"/></svg>
            <input type="text" name="email_or_username" class="kh-input" placeholder="email or username" autocomplete="username" required />
          </div>
        </div>

        <div class="kh-field">
          <div class="kh-label-row">
            <label class="kh-label">Password</label>
            <button type="button" class="kh-text-btn" id="showForgot">Forgot password?</button>
          </div>
          <div class="kh-input-wrap">
            <svg class="kh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" name="password" id="loginPwd" class="kh-input" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="kh-eye" id="toggleLoginPwd" aria-label="Toggle password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="kh-btn">
          <span class="kh-btn-text">Sign In</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </form>

      <p class="kh-foot">No account yet? <a href="{% url 'signup' %}" class="kh-link">Create one</a></p>
    </div>
  </div>

  <!-- ════════════════════════════════════════
       SCREEN: FORGOT PASSWORD (enter email)
  ════════════════════════════════════════ -->
  <div class="kh-wrap kh-hidden" id="screenForgot">

    <button type="button" class="kh-back" id="backToLogin">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 5-7 7 7 7"/></svg>
      Back to login
    </button>

    <div class="kh-header">
      <div class="kh-logo" style="font-size:1.4rem;">🔑</div>
      <h1 class="kh-title">Forgot password?</h1>
      <p class="kh-sub">We'll send a reset code to your email</p>
    </div>

    <div class="kh-card">
      <div id="forgotAlert"></div>

      <form id="forgotForm" method="POST" action="{% url 'forgot_password' %}">
        {% csrf_token %}
        <div class="kh-field">
          <label class="kh-label">Email address</label>
          <div class="kh-input-wrap">
            <svg class="kh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" name="email" id="forgotEmail" class="kh-input" placeholder="you@company.com" required />
          </div>
        </div>

        <div class="kh-field">
          <label class="kh-label">New password <span class="kh-req">*</span></label>
          <div class="kh-input-wrap">
            <svg class="kh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" name="new_password" id="newPwd" class="kh-input" placeholder="Create a strong password" required />
            <button type="button" class="kh-eye" id="toggleNewPwd">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="kh-field">
          <label class="kh-label">Confirm password <span class="kh-req">*</span></label>
          <div class="kh-input-wrap">
            <svg class="kh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" name="confirm_password" id="newPwdConfirm" class="kh-input" placeholder="Repeat password" required />
          </div>
        </div>

        <button type="submit" class="kh-btn" id="resetSubmitBtn">
          <span class="kh-btn-text">Reset Password</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </form>
    </div>
  </div>




  <script>
  (function () {
    // Minimal script: toggle between login and reset screens, basic password toggles
    function showScreen(id) {
      ['screenLogin','screenForgot'].forEach(s => {
        const el = document.getElementById(s);
        if (!el) return;
        el.classList.toggle('kh-hidden', s !== id);
      });
    }

    const showForgotBtn = document.getElementById('showForgot');
    const backToLogin = document.getElementById('backToLogin');
    if (showForgotBtn) showForgotBtn.addEventListener('click', () => showScreen('screenForgot'));
    if (backToLogin) backToLogin.addEventListener('click', () => showScreen('screenLogin'));

    const toggleLoginPwd = document.getElementById('toggleLoginPwd');
    if (toggleLoginPwd) toggleLoginPwd.addEventListener('click', () => {
      const el = document.getElementById('loginPwd'); if (!el) return;
      el.type = el.type === 'password' ? 'text' : 'password';
    });

    const toggleNewPwd = document.getElementById('toggleNewPwd');
    if (toggleNewPwd) toggleNewPwd.addEventListener('click', () => {
      const el = document.getElementById('newPwd'); if (!el) return;
      el.type = el.type === 'password' ? 'text' : 'password';
    });

  })();
  </script>

</body>
</html>
