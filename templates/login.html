{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - KollabHub</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body class="auth-page">

<!-- Background Glows -->
<div class="auth-bg">
    <div class="auth-glow auth-glow-left"></div>
    <div class="auth-glow auth-glow-right"></div>
</div>

<!-- Back Button -->
<a href="{% url 'home' %}" class="back-link">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
    </svg>
    Back
</a>

<div class="auth-container" id="authContainer">
    <div class="auth-header">
        <div class="auth-logo">K</div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to access your workspace</p>
    </div>

    <div class="auth-card">
        {% if error %}
        <div class="error-wrapper">
            <div class="error-message">
                <span class="error-icon">⚠</span>
                <span class="error-text">{{ error }}</span>
            </div>
        </div>
        {% endif %}

        <form method="POST" class="auth-form" id="loginForm">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Username</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-8 16-8 16 0"/>
                    </svg>
                    <input type="text" name="username" class="form-input" placeholder="Enter your username" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>
                <div class="form-helper">
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-full">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? 
            <a href="{% url 'signup' %}" class="auth-link">Create one</a>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const authContainer = document.getElementById('authContainer');
        if (authContainer) {
            authContainer.style.opacity = '0';
            authContainer.style.transform = 'translateY(20px)';
            setTimeout(() => {
                authContainer.style.transition = 'all 0.5s ease';
                authContainer.style.opacity = '1';
                authContainer.style.transform = 'translateY(0)';
            }, 100);
        }

        // Error message auto-dismiss
        const errorBox = document.querySelector(".error-wrapper");
        if (errorBox) {
            setTimeout(() => {
                errorBox.style.opacity = "0";
                errorBox.style.transform = "translateY(-10px)";
                setTimeout(() => errorBox.remove(), 300);
            }, 4000);
        }
    });
</script>

</body>
</html>
