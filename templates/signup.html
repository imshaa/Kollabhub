{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - KollabHub</title>
    
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body class="auth-page">

<!-- Background -->
<div class="auth-bg">
    <div class="auth-glow auth-glow-right"></div>
    <div class="auth-glow auth-glow-left"></div>
</div>
{% if error %}
    <div class="error-wrapper">
        <div class="error-message">
            <span class="error-icon">⚠</span>
            <span class="error-text">{{ error }}</span>
        </div>
    </div>
    {% endif %}

    <!-- signup forrm -->
<div class="auth-container" id="authContainer">


    <div class="auth-header">
        <div class="auth-logo">K</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Start collaborating with your team today</p>
    </div>

    <div class="auth-card">
        <form method="POST" class="auth-form">
            {% csrf_token %}

            <!-- Username -->
            <div class="form-group">
                <label class="form-label">Username</label>
                <div class="input-wrapper">
                    <input type="text"
                           name="username"
                           class="form-input"
                           placeholder="Enter username"
                           required>
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div class="input-wrapper">
                    <input type="email"
                           name="email"
                           class="form-input"
                           placeholder="name@company.com"
                           required>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <input type="password"
                           name="password"
                           class="form-input"
                           placeholder="Create a password"
                           required>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password"
                           name="confirm_password"
                           class="form-input"
                           placeholder="Confirm your password"
                           required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-full">
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="{% url 'login' %}" class="auth-link">Sign in</a>
        </div>
    </div>
</div>

<!-- Minimal animation JS only -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const authContainer = document.getElementById('authContainer');
    if (authContainer) {
        authContainer.style.opacity = '0';
        authContainer.style.transform = 'translateY(20px)';
        setTimeout(() => {
            authContainer.style.transition = 'all 0.5s ease';
            authContainer.style.opacity = '1';
            authContainer.style.transform = 'translateY(0)';
        }, 100);
    }
});

// error messages 
        document.addEventListener("DOMContentLoaded", function () {
    const errorBox = document.querySelector(".error-wrapper");
    if (errorBox) {
        setTimeout(() => {
            errorBox.style.opacity = "0";
            errorBox.style.transform = "translateY(-10px)";
            setTimeout(() => errorBox.remove(), 300);
        }, 4000);
    }
});
</script>

</body>
</html>
