{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - KollabHub</title>
    
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body class="auth-page">

<!-- Background -->
<div class="auth-bg">
    <div class="auth-glow auth-glow-right"></div>
    <div class="auth-glow auth-glow-left"></div>
</div>

<!-- Back Button -->
<a href="{% url 'home' %}" class="back-link">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
    </svg>
    Back
</a>

<div class="auth-container" id="authContainer">
    <div class="auth-header">
        <div class="auth-logo">K</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join KollabHub and start collaborating</p>
    </div>

    <div class="auth-card">
        {% if error %}
        <div class="error-wrapper">
            <div class="error-message">
                <span class="error-icon">⚠</span>
                <span class="error-text">{{ error }}</span>
            </div>
        </div>
        {% endif %}

        <form method="POST" class="auth-form" id="signupForm">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">Username</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-8 16-8 16 0"/>
                    </svg>
                    <input type="text" name="username" class="form-input" placeholder="Choose a username" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                    </svg>
                    <input type="email" name="email" class="form-input" placeholder="name@company.com" required>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="password" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm</label>
                    <div class="input-wrapper">
                        <input type="password" name="confirm_password" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-top: 1rem;">
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? 
            <a href="{% url 'login' %}" class="auth-link">Sign In</a>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const authContainer = document.getElementById('authContainer');
        if (authContainer) {
            authContainer.style.opacity = '0';
            authContainer.style.transform = 'translateY(20px)';
            setTimeout(() => {
                authContainer.style.transition = 'all 0.5s ease';
                authContainer.style.opacity = '1';
                authContainer.style.transform = 'translateY(0)';
            }, 100);
        }

        // Error message auto-dismiss
        const errorBox = document.querySelector(".error-wrapper");
        if (errorBox) {
            setTimeout(() => {
                errorBox.style.opacity = "0";
                errorBox.style.transform = "translateY(-10px)";
                setTimeout(() => errorBox.remove(), 300);
            }, 4000);
        }
    });
</script>

</body>
</html>
